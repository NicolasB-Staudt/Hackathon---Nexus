<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../public/assets/css/responsavel-extrato.css">

    <title>Extrato</title>

</head>

<body>

    <header class="topo">

        <div class="logo">
            Cantina Escolar
        </div>

        <nav>
            <a href="responsavel-home.html">Início</a>
            <a href="responsavel-extrato.html">Extrato</a>
            <a href="#">Sair</a>
        </nav>

    </header>


    <main class="extrato">

        <section class="cabecalho">

            <div>
                <h1>Extrato de consumo</h1>
                <p>Lucas Silva - 6º ano A</p>
            </div>

            <select>
                <option>Setembro de 2026</option>
                <option>Agosto de 2026</option>
            </select>

        </section>


        <section class="resumo">

            <div>
                <span>Compras realizadas</span>
                <strong>12</strong>
            </div>

            <div>
                <span>Total do mês</span>
                <strong>R$ 87,00</strong>
            </div>

        </section>


        <section class="tabela">

            <div class="linha titulo">
                <span>Data</span>
                <span>Descrição</span>
                <span>Valor</span>
            </div>

            <div class="linha">
                <span>26/09 - 10:05</span>
                <span>Pastel de carne + Suco</span>
                <strong>R$ 12,00</strong>
            </div>

            <div class="linha">
                <span>25/09 - 15:10</span>
                <span>Pão de queijo</span>
                <strong>R$ 4,50</strong>
            </div>

            <div class="linha">
                <span>24/09 - 10:12</span>
                <span>Bolo de chocolate</span>
                <strong>R$ 4,00</strong>
            </div>

        </section>

    </main>

</body>
</html>
