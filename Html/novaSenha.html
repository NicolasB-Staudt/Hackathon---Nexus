<!DOCTYPE html>

<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="../public/assets/css/novaSenha.css" rel="stylesheet"/>
<title>Redefinir Senha</title>
<link href="../public/assets/css/common.css" rel="stylesheet"/><link href="../public/assets/css/theme.css" rel="stylesheet"/></head>
<body><noscript><p class="cmd-empty">Ative o JavaScript para carregar os dados da cantina.</p></noscript>
<main class="redefinir">
<section class="cabecalho">
<h1>Cantina Escolar</h1>
<h2>Redefinir senha</h2>
<p>
                Informe o código recebido e defina uma nova senha.
            </p>
</section>
<section class="formulario">
<div class="campo">
<label for="codigo">Código</label>
<input id="codigo" name="codigo" placeholder="Digite o código" type="text"/>
</div>
<div class="campo">
<label for="novaSenha">Nova senha</label>
<input id="novaSenha" name="novaSenha" placeholder="Digite sua nova senha" type="password"/>
</div>
<div class="campo">
<label for="confirmarSenha">Confirmar senha</label>
<input id="confirmarSenha" name="confirmarSenha" placeholder="Digite novamente sua senha" type="password"/>
</div>
</section>
<section class="botoes">
<a class="Confirmar" href="#">
                Confirmar nova senha
            </a>
<a class="voltar" href="login.html">
                Voltar para o login
            </a>
</section>
</main>
<script src="../public/assets/js/common.js"></script><script src="../public/assets/js/novaSenha.js"></script></body>
</html>
