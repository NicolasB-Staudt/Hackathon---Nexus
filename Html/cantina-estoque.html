<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../public/assets/css/cantina-estoque.css">

    <title>Estoque</title>

</head>

<body>

    <header class="topo">

        <div class="logo">
            Cantina Escolar
        </div>

        <nav>
            <a href="cantina-painel.html">Início</a>
            <a href="cantina-pedidos.html">Pedidos</a>
            <a href="cantina-cardapio.html">Cardápio</a>
            <a href="cantina-estoque.html">Estoque</a>
            <a href="cantina-balcao.html">Balcão</a>
        </nav>

    </header>


    <main class="pagina">

        <section class="cabecalho">

            <div>
                <h1>Estoque</h1>
                <p>Acompanhe a disponibilidade dos produtos.</p>
            </div>

            <button>
                Adicionar item
            </button>

        </section>


        <section class="tabela">

            <div class="linha titulo">
                <span>Produto</span>
                <span>Quantidade</span>
                <span>Status</span>
                <span>Ação</span>
            </div>

            <div class="linha">
                <span>Pastel de carne</span>
                <span>20 unidades</span>
                <strong class="normal">Normal</strong>
                <button>Editar</button>
            </div>

            <div class="linha">
                <span>Suco de laranja</span>
                <span>3 unidades</span>
                <strong class="baixo">Estoque baixo</strong>
                <button>Editar</button>
            </div>

            <div class="linha">
                <span>Bolo de chocolate</span>
                <span>0 unidades</span>
                <strong class="esgotado">Esgotado</strong>
                <button>Editar</button>
            </div>

        </section>

    </main>

</body>
</html>
