<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../public/assets/css/cadastroResponsavel.css">

    <title>Cadastro de Responsável</title>
</head>

<body>

    <main class="cadastro">

        <section class="cabecalho">
            <h1>Cantina Escolar</h1>
            <p>Cadastro do responsável</p>
        </section>

        <section class="formulario">

            <div class="campo">
                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                >
            </div>

            <div class="linha">

                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                    >
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000"
                    >
                </div>

            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                >
            </div>

            <div class="linha">

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                    >
                </div>

                <div class="campo">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input
                        type="password"
                        id="confirmarSenha"
                        name="confirmarSenha"
                        placeholder="Confirme a senha"
                    >
                </div>

            </div>

            <div class="vinculo">

                <h2>Vincular aluno</h2>

                <p>
                    Informe o código do aluno para associar a conta.
                </p>

                <div class="campo">
                    <label for="codigoAluno">Código do aluno</label>
                    <input
                        type="text"
                        id="codigoAluno"
                        name="codigoAluno"
                        placeholder="Digite o código do aluno"
                    >
                </div>

            </div>

        </section>

        <section class="botoes">

            <a href="#" class="Cadastrar">
                Criar conta
            </a>

            <a href="login.html" class="voltar">
                Voltar para o login
            </a>

        </section>

    </main>

</body>
</html>
