<!DOCTYPE html>

<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="../public/assets/css/cadastroResponsavel.css" rel="stylesheet"/>
<title>Cadastro de Responsável</title>
<link href="../public/assets/css/common.css" rel="stylesheet"/><link href="../public/assets/css/theme.css" rel="stylesheet"/></head>
<body><noscript><p class="cmd-empty">Ative o JavaScript para carregar os dados da cantina.</p></noscript>
<main class="cadastro">
<section class="cabecalho">
<h1>Cantina Escolar</h1>
<p>Cadastro do responsável</p>
</section>
<section class="formulario">
<div class="campo">
<label for="nome">Nome completo</label>
<input id="nome" name="nome" placeholder="Digite seu nome" type="text"/>
</div>
<div class="linha">
<div class="campo">
<label for="cpf">CPF</label>
<input id="cpf" name="cpf" placeholder="000.000.000-00" type="text"/>
</div>
<div class="campo">
<label for="telefone">Telefone</label>
<input id="telefone" name="telefone" placeholder="(00) 00000-0000" type="tel"/>
</div>
</div>
<div class="campo">
<label for="email">E-mail</label>
<input id="email" name="email" placeholder="Digite seu e-mail" type="email"/>
</div>
<div class="linha">
<div class="campo">
<label for="senha">Senha</label>
<input id="senha" name="senha" placeholder="Digite sua senha" type="password"/>
</div>
<div class="campo">
<label for="confirmarSenha">Confirmar senha</label>
<input id="confirmarSenha" name="confirmarSenha" placeholder="Confirme a senha" type="password"/>
</div>
</div>
<div class="vinculo">
<h2>Vincular aluno</h2>
<p>
                    A cantina confirma os vínculos entre responsáveis e alunos.
                </p>
<p class="cmd-empty">Após o cadastro, solicite à cantina o vínculo com o aluno.</p>
</div>
</section>
<section class="botoes">
<a class="Cadastrar" href="#">
                Criar conta
            </a>
<a class="voltar" href="inde.html">
                Voltar para o login
            </a>
</section>
</main>
<script src="../public/assets/js/common.js"></script><script src="../public/assets/js/cadastroResponsavel.js"></script></body>
</html>
