<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitar acesso · Cantina</title><link rel="stylesheet" href="../public/assets/css/common.css"><link rel="stylesheet" href="../public/assets/css/acesso.css"><link href="../public/assets/css/theme.css" rel="stylesheet"/></head><body class="acesso"><main class="acesso-layout"><section class="apresentacao"><span class="marca">CANTINA ESCOLAR</span><h1>Faça parte<br>da equipe.</h1><p>Envie sua solicitação. Um administrador aprovado analisará seu acesso.</p></section><section class="acesso-card"><h2>Solicitar acesso administrativo</h2><p>O cadastro não libera o painel automaticamente.</p><form id="solicitacao"><label for="nome">Nome completo</label><input id="nome" required maxlength="100" autocomplete="name"><label for="email">E-mail</label><input id="email" type="email" required maxlength="120" autocomplete="email"><label for="senha">Senha (mínimo de 8 caracteres)</label><input id="senha" type="password" required minlength="8" maxlength="72" autocomplete="new-password"><label for="confirmacao">Confirmar senha</label><input id="confirmacao" type="password" required minlength="8" autocomplete="new-password"><p class="aviso">Você poderá entrar após a aprovação de um administrador.</p><button class="cmd-btn entrar">Enviar solicitação</button></form><p id="mensagem" role="status" aria-live="polite"></p><a href="inde.html">Voltar para o login</a></section></main><script src="../public/assets/js/common.js"></script><script src="../public/assets/js/cadastroAdministrador.js"></script></body></html>
