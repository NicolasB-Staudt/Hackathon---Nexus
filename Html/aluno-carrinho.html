<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../public/assets/css/aluno-carrinho.css">

    <title>Carrinho</title>

</head>

<body>

    <header class="topo">

        <div class="logo">
            Cantina Escolar
        </div>

        <nav>
            <a href="aluno-perfil.html">Perfil</a>
            <a href="aluno-home.html">Home</a>
            <a href="aluno-carrinho.html">Carrinho</a>
        </nav>

    </header>


    <main class="principal">

        <section class="carrinho">

            <h1>Seu pedido</h1>

            <p class="descricao">
                Confira os itens antes de confirmar.
            </p>


            <article class="item">

                <div class="foto">
                    FOTO
                </div>

                <div class="dados">
                    <h2>Pastel de carne</h2>
                    <p>Quantidade: 1</p>
                </div>

                <strong>R$ 7,00</strong>

                <button>
                    Remover
                </button>

            </article>


            <article class="item">

                <div class="foto">
                    FOTO
                </div>

                <div class="dados">
                    <h2>Suco de laranja</h2>
                    <p>Quantidade: 1</p>
                </div>

                <strong>R$ 5,00</strong>

                <button>
                    Remover
                </button>

            </article>


            <div class="intervalo">

                <label for="horario">
                    Intervalo para retirada
                </label>

                <select id="horario">

                    <option>
                        1º intervalo - 09:00 às 09:20
                    </option>

                    <option>
                        2º intervalo - 15:00 às 15:20
                    </option>

                </select>

            </div>

        </section>


        <aside class="resumo">

            <h2>Resumo</h2>

            <div class="linhaResumo">
                <span>Itens</span>
                <span>R$ 12,00</span>
            </div>

            <div class="linhaResumo">
                <span>Saldo atual</span>
                <span>R$ 42,50</span>
            </div>

            <div class="total">
                <span>Total</span>
                <strong>R$ 12,00</strong>
            </div>

            <button class="confirmar">
                Confirmar pedido
            </button>

            <a href="aluno-home.html">
                Continuar escolhendo
            </a>

        </aside>

    </main>

</body>
</html>
